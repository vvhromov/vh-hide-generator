name: Create Custom Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build plugin archive
        run: |
          # Создаём временную папку с нужным именем
          mkdir -p build/vh-hide-generator

          # Копируем файлы плагина, исключая служебные
          rsync -a --exclude='.github' \
                   --exclude='.git' \
                   --exclude='build' \
                   --exclude='.gitignore' \
                   ./ build/vh-hide-generator/

          # Проверяем, что файл на месте
          ls -la build/vh-hide-generator/

          # Пакуем: внутри архива будет папка vh-hide-generator/
          cd build
          zip -r ../vh-hide-generator.zip vh-hide-generator

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: vh-hide-generator.zip
          generate_release_notes: true
